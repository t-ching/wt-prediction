<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/main.css">
    <title>Indigo | Waiting time predictor</title>
</head>
<body>
	<!--<img src="/static/img/logo.svg" alt="Logo" class="page-logo">-->
<div class="page-wrapper">
	<h2>Indigo Community Services and Health Hub</h2>
	<h2>Waiting time predictor</h2>
    
	<form action="/show_waiting_time" method="post">
        <div class="form-container">
            
            <div class="form-group">
                <label for="NumDoctorsOnDuty">No. of Doctors on Duty</label>
                <select id="NumDoctorsOnDuty" name="NumDoctorsOnDuty" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="NumReceptionistsOnDuty">No. of Receptionists on Duty</label>
                <select id="NumReceptionistsOnDuty" name="NumReceptionistsOnDuty" required>
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <div class="form-group">
                <label for="Temperature">Temperature (°C)</label>
                <input type="number" id="Temperature" name="Temperature" min="-10" max="50" step="0.1" value="19.2" required>
            </div>

            <div class="form-group">
                <label for="Rainfall">Rainfall (mm)</label>
                <input type="number" id="Rainfall" name="Rainfall" min="0" step="0.1" value="0.0" required>
            </div>

            <div class="form-group">
                <label for="PctPriorVacantSlots">% Prior Vacant Slots</label>
                <input type="number" id="PctPriorVacantSlots" name="PctPriorVacantSlots" min="0" max="100" step="0.1" value="0" required>
            </div>

            <div class="form-group">
                <label for="PriorEmergency">Prior Emergency Status</label>
                <select id="PriorEmergency" name="PriorEmergency" required>
                    <option value="0" selected>No Emergency</option>
                    <option value="1">Emergency Active</option>
                </select>
            </div>

            <div class="form-group">
                <label for="AvgDoctorExperience">Avg. Doctor Experience (Years)</label>
                <input type="number" id="AvgDoctorExperience" name="AvgDoctorExperience" min="0" step="0.1" value="5.8" required>
            </div>

            <div class="form-group">
                <label for="PctSwitch">% Willing to Switch</label>
                <input type="number" id="PctSwitch" name="PctSwitch" min="0" max="100" step="0.1" value="26" required>
            </div>

            <div class="form-group">
                <label for="AvgAgePrior">Avg. Age Prior Patients</label>
                <input type="number" id="AvgAgePrior" name="AvgAgePrior" min="0" step="0.1" value="37.7" required>
            </div>
            
        </div>

        <div style="padding-top: 25px;">
            <input type="submit" value="Submit" class="submit-btn">
        </div>
    </form>
</div>
</body>
</html>
